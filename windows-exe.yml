name: Build NetPulse for Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Create standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-data customtkinter --name NetPulse --icon assets/netpulse.ico main.py
      - name: Save executable
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-Windows-EXE
          path: dist/NetPulse.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NetPulse-Windows-EXE
          path: release
      - name: Release executable
        uses: softprops/action-gh-release@v2
        with:
          files: release/NetPulse.exe
          generate_release_notes: true
